# Runs on Windows because it has to: every source file carries
# "//go:build windows && amd64", so on a Linux runner Go would find nothing
# to build and every step would report success without checking a line.
#
# What this proves: the tool still builds, is gofmt/vet-clean, and its logic
# (subtitle layout, cleaner, language decisions, flags, the -json protocol)
# still behaves. It cannot transcribe anything: the runner has no GPU, no
# FFmpeg and no Python engine.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The EXE embeds its own source archive (go:embed); build.bat creates it.
      - name: pack embedded source
        run: |
          $inc = Get-ChildItem -File | Where-Object { @('.go','.mod','.sum','.md','.bat','.py') -contains $_.Extension }
          Compress-Archive -Path $inc.FullName -DestinationPath SuperSubtitler_src.zip -Force

      # gofmt -l prints offenders and still exits 0; the output is the verdict.
      - name: gofmt
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) {
            Write-Host "::error::These files are not gofmt-clean:"
            $unformatted | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "All sources are gofmt-clean."

      - name: go vet
        run: go vet .

      - name: go test
        run: go test -count=1 .

      - name: go build
        run: go build -ldflags="-s -w" -o SuperSubtitler.exe .

      - name: transcribe.py syntax
        run: python -m py_compile transcribe.py
