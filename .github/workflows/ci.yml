# Runs on Windows because it has to: every source file carries
# "//go:build windows && amd64", so on a Linux runner Go would find nothing
# to build and every step would report success without checking a line.
#
# What this proves: the tool still builds, is gofmt/vet-clean, and its logic
# (subtitle layout, cleaner, language decisions, flags, the -json protocol)
# still behaves. It cannot transcribe anything: the runner has no GPU, no
# FFmpeg and no Python engine.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # gofmt -l prints offenders and still exits 0; the output is the verdict.
      - name: gofmt
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) {
            Write-Host "::error::These files are not gofmt-clean:"
            $unformatted | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "All sources are gofmt-clean."

      - name: go vet
        run: go vet .

      - name: go test
        run: go test -count=1 .

      - name: go build
        run: go build -ldflags="-s -w" -o SuperSubtitler.exe .

      - name: transcribe.py syntax and tests
        run: |
          python -m py_compile transcribe.py
          python -m unittest -v transcribe_test

  # The real thing, end to end on Windows: the built EXE installs its pinned
  # runtime (FFmpeg, Python, pip, the exact packages - each hash-checked, the
  # mirror first), then subtitles a test video and the text is checked.
  # The tiny model keeps it fast. Device and CUDA stay at their defaults: the
  # runner has no NVIDIA card, so SuperSubtitler must notice that by itself -
  # no CUDA download, the processor straight away. This is also the check that
  # would have caught the PyAV 19 break.
  e2e:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: |
          New-Item -ItemType Directory e2e | Out-Null
          go build -o e2e\SuperSubtitler.exe .
          Set-Content -Path e2e\SuperSubtitler_Config.ini -Value @(
            'detect_model=tiny', 'model_transcribe=tiny', 'model_translate=tiny')
          Invoke-WebRequest https://raw.githubusercontent.com/openai/whisper/main/tests/jfk.flac -OutFile e2e\jfk.flac

      - name: setup (pinned runtime)
        working-directory: e2e
        run: |
          .\SuperSubtitler.exe -setup -json > setup.jsonl
          $code = $LASTEXITCODE
          Get-Content setup.jsonl | Select-String '"ev":"(error|summary)"'
          if ($code -ne 0) { Write-Host "::error::-setup exited with $code"; exit 1 }
          Write-Host "--- installed:"; Get-Content .ss_ffmpeg; Get-Content Python\.ss_ready
          $v = .\SuperSubtitler.exe -version | Out-String
          Write-Host $v
          if ($v -notmatch 'no NVIDIA') { Write-Host "::error::the runner has no NVIDIA card, but it was not noticed"; exit 1 }
          if ((Get-Content Python\.ss_ready) -notmatch 'cuda:false') { Write-Host "::error::CUDA was installed without an NVIDIA card"; exit 1 }
          if (Test-Path Python\Lib\site-packages\nvidia) { Write-Host "::error::CUDA libraries were downloaded without an NVIDIA card"; exit 1 }
          Get-ChildItem whisper\models\pinned

      - name: subtitle a test video
        working-directory: e2e
        run: |
          .\ffmpeg.exe -v error -y -f lavfi -i color=c=black:s=320x240:r=25 -i jfk.flac -shortest -c:v mpeg4 -c:a aac test.mkv
          .\SuperSubtitler.exe -json -auto test.mkv > run.jsonl
          $code = $LASTEXITCODE
          if ($code -ne 0) { Get-Content run.jsonl; Write-Host "::error::run exited with $code"; exit 1 }
          $srt = Get-Content test.en.srt -Raw
          Write-Host $srt
          # Line breaks depend on timing, not on what was said: compare the words only.
          $words = ($srt -replace '(?m)^\d+\s*$', ' ' -replace '\d\d:\d\d:\d\d,\d+ --> \d\d:\d\d:\d\d,\d+', ' ' -replace '\s+', ' ')
          if ($words -notmatch 'ask not what your country can do for you') { Write-Host "::error::the transcript is not what was said"; exit 1 }
          if (-not (Test-Path test.subbed.mkv)) { Write-Host "::error::no .subbed.mkv"; exit 1 }
          .\SuperSubtitler.exe -json -auto test.mkv > again.jsonl
          if (-not (Select-String -Path again.jsonl -Pattern '"reason":"has_subs"' -Quiet)) { Write-Host "::error::a finished file was not skipped"; exit 1 }

      # Speaker marking: a recording with four voices must show several
      # speaker changes, JFK alone none - and a single voice must never get
      # "- " dialogue lines.
      - name: mark speakers
        working-directory: e2e
        run: |
          Invoke-WebRequest https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-segmentation-models/0-four-speakers-zh.wav -OutFile four.wav
          function Changes($events) {
            $ev = Get-Content $events | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.ev -eq 'speakers' }
            if (-not $ev) { Get-Content $events; Write-Host "::error::no speakers event in $events"; exit 1 }
            if ($ev.message) { Write-Host "::error::speaker marking failed: $($ev.message)"; exit 1 }
            return [int]$ev.changes
          }
          .\SuperSubtitler.exe -json -auto -speakers four.wav > four.jsonl
          if ($LASTEXITCODE -ne 0) { Get-Content four.jsonl; Write-Host "::error::run exited with $LASTEXITCODE"; exit 1 }
          $n = Changes four.jsonl
          Get-Content four.*.srt
          Write-Host "four-speaker recording: $n speaker changes"
          if ($n -lt 3) { Write-Host "::error::expected at least 3 speaker changes, got $n"; exit 1 }
          .\SuperSubtitler.exe -json -auto -speakers jfk.flac > jfk.jsonl
          if ($LASTEXITCODE -ne 0) { Get-Content jfk.jsonl; Write-Host "::error::run exited with $LASTEXITCODE"; exit 1 }
          $n = Changes jfk.jsonl
          $srt = Get-Content jfk.en.srt -Raw
          Write-Host $srt
          if ($n -ne 0) { Write-Host "::error::JFK alone must have no speaker change, got $n"; exit 1 }
          if ($srt -match '(?m)^- ') { Write-Host "::error::a single voice got dialogue dashes"; exit 1 }

      # Several audio tracks of one language: the best-understood one must be
      # taken - not the one buried in noise, not the commentary.
      - name: pick the best track
        working-directory: e2e
        run: |
          .\ffmpeg.exe -v error -y -f lavfi -i color=c=black:s=320x240:r=25 -i jfk.flac -f lavfi -i "anoisesrc=color=pink:amplitude=0.8" `
            -filter_complex "[1:a]asplit=3[a][b][c];[a][2:a]amix=inputs=2:duration=first:normalize=0[noisy]" `
            -map 0:v -map "[noisy]" -map "[b]" -map "[c]" -shortest -c:v mpeg4 -c:a aac `
            -metadata:s:a:0 language=eng -metadata:s:a:1 language=eng -metadata:s:a:2 language=eng -metadata:s:a:2 title="Director's Commentary" tracks.mkv
          .\SuperSubtitler.exe -json -auto -srtonly tracks.mkv > tracks.jsonl
          if ($LASTEXITCODE -ne 0) { Get-Content tracks.jsonl; Write-Host "::error::run exited with $LASTEXITCODE"; exit 1 }
          $files = Get-Content tracks.jsonl | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.ev -eq 'file' }
          $chosen = @($files[-1].tracks | ForEach-Object { $_.n })
          Write-Host "tracks chosen: $($chosen -join ',')"
          if ($chosen.Count -ne 1 -or $chosen[0] -ne 2) { Get-Content tracks.jsonl; Write-Host "::error::expected only track 2 (the clear one), got $($chosen -join ',')"; exit 1 }

      # Translation (-to): JFK into German, a second subtitle file next to the
      # English one. The 3 GB model makes this the slowest step.
      - name: translate
        working-directory: e2e
        run: |
          .\SuperSubtitler.exe -json -auto -force -to:de jfk.flac > to.jsonl
          if ($LASTEXITCODE -ne 0) { Get-Content to.jsonl; Write-Host "::error::run exited with $LASTEXITCODE"; exit 1 }
          if (-not (Test-Path jfk.de.srt)) { Get-Content to.jsonl; Write-Host "::error::no jfk.de.srt"; exit 1 }
          $de = Get-Content jfk.de.srt -Raw -Encoding UTF8
          Write-Host $de
          if ($de -notmatch 'Land') { Write-Host "::error::that is no German translation of JFK"; exit 1 }
          if ((Get-Content to.jsonl | Select-String '"outputs":\[[^]]*jfk\.de\.srt' -Quiet) -ne $true) { Write-Host "::error::the result does not list jfk.de.srt"; exit 1 }

  gui:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: gui/go.mod
          cache: true
          cache-dependency-path: gui/go.sum

      # There is no npm and no bundler - the window is index.html + logic.js.
      # Node is only here to run the checks of its script.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: gofmt
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) {
            Write-Host "::error::These files are not gofmt-clean:"
            $unformatted | ForEach-Object { Write-Host "  $_" }
            exit 1
          }

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 ./...

      # The same tags "wails build" sets; without them the exe refuses to start.
      - name: go build
        run: go build -tags desktop,production -ldflags="-s -w -H windowsgui" -o SuperSubtitlerGUI.exe .

      # The guard on an empty list matters: renamed checks must not turn this
      # step into one that is green while checking nothing.
      - name: window checks
        run: |
          $checks = Get-ChildItem -Path frontend\*_check.js | Sort-Object Name
          if (-not $checks) { Write-Host "::error::No frontend\*_check.js found."; exit 1 }
          $failed = @()
          foreach ($check in $checks) {
            Write-Host "--- $($check.Name)"
            node $check.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $check.Name }
          }
          if ($failed) { Write-Host "::error::Failed: $($failed -join ', ')"; exit 1 }
