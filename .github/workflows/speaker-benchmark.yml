# Measures how well -speakers finds the moments the speaking voice changes,
# on a fixed, checksummed part of VoxConverse (66 minutes of debates and
# news, 1-11 speakers, labelled by hand). Runs transcribe.py --diarize - the
# code SuperSubtitler runs - with the pinned model, and fails when it finds
# fewer changes, or fewer quick ones, than the limits below. Linux is enough
# here: onnxruntime computes the same on every system.
#
# By hand with "sweep" ticked it compares several thresholds side by side
# (one job each, in parallel) and prints a ranking - the basis for the
# shipped speaker_change_threshold.
name: Speaker benchmark

on:
  workflow_dispatch:
    inputs:
      sweep:
        description: 'Compare thresholds'
        type: boolean
        default: false
      thresholds:
        description: 'Sweep only: thresholds (space-separated; empty = the list below)'
        type: string
        default: ''
  push:
    paths:
      - Speakers.go
      - transcribe.py
      - runtime.json
      - Config.go
      - .github/scripts/speaker_bench.py
      - .github/workflows/speaker-benchmark.yml

permissions:
  contents: read

env:
  # The shipped setup must not do worse than this (percent). Measured for
  # speaker_change_threshold 0.15: F1 73.1, short recall 57.6.
  MIN_F1: '71'
  MIN_SHORT_RECALL: '55'
  THRESHOLDS: '0.1 0.15 0.2 0.25 0.3 0.4 0.5'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        shell: python
        env:
          SWEEP: ${{ inputs.sweep && 'yes' || 'no' }}
          IN_THRESHOLDS: ${{ inputs.thresholds }}
        run: |
          import json, os
          if os.environ["SWEEP"] == "yes":
              jobs = [{"threshold": t} for t in (os.environ.get("IN_THRESHOLDS") or os.environ["THRESHOLDS"]).split()]
          else:
              jobs = [{"threshold": "shipped"}]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": jobs}) + "\n")

  # The test set is fetched once and handed to every measuring job through
  # the cache: dozens of jobs pulling it from Oxford at the same moment get
  # turned away.
  testset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: bench/voxconverse
          key: speaker-bench-voxconverse-${{ hashFiles('.github/scripts/speaker_bench.py') }}
          restore-keys: speaker-bench-voxconverse-
      - name: fetch test set
        run: python .github/scripts/speaker_bench.py fetch bench --testset-only

  measure:
    needs: [plan, testset]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: threshold ${{ matrix.threshold }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install
        run: |
          pins=$(python -c "import json; print(' '.join('%s==%s' % (p['name'], p['version']) for p in json.load(open('runtime.json'))['packages'] if p['name'] in ('onnxruntime', 'numpy')))")
          pip install --quiet $pins

      - uses: actions/cache/restore@v4
        with:
          path: bench/voxconverse
          key: speaker-bench-voxconverse-${{ hashFiles('.github/scripts/speaker_bench.py') }}
          restore-keys: speaker-bench-voxconverse-
          fail-on-cache-miss: true

      - name: fetch models and test set
        run: python .github/scripts/speaker_bench.py fetch bench

      - name: measure
        run: |
          if [ "${{ matrix.threshold }}" = "shipped" ]; then
            args="--min-f1 $MIN_F1 --min-short-recall $MIN_SHORT_RECALL"
          else
            args="--threshold ${{ matrix.threshold }}"
          fi
          python .github/scripts/speaker_bench.py run bench $args --json result.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ strategy.job-index }}
          path: result.json
          if-no-files-found: ignore

  ranking:
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
      - name: ranking
        shell: python
        run: |
          import glob, json, os
          rows = [r for f in glob.glob("result-*/result.json") for r in json.load(open(f))]
          rows.sort(key=lambda r: -r["f1"])
          out = ["### Speaker changes ranking (VoxConverse, 66 min, 1-11 speakers; higher is better)", "",
                 "| threshold | F1 | recall | short recall | precision | found / real |",
                 "|---|---|---|---|---|---|"]
          for r in rows:
              out.append("| %s | **%s** | %s | %s | %s | %s / %s |" % (r["threshold"], r["f1"], r["recall"],
                         r["short_recall"], r["precision"], r["found"], r["real"]))
          text = "\n".join(out)
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(text + "\n")
